[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qemu-scanout-diff"
version = "0.1.0"
description = "Capture, analyze, and compare raw QEMU framebuffer scanouts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YAODONG ZHANG" }]
keywords = ["qemu", "framebuffer", "regression-testing", "rgba", "emulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Emulators",
]
dependencies = ["Pillow>=10.0"]

[project.scripts]
qemu-scanout = "qemu_scanout_diff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qemu_scanout_diff"]

[project.urls]
Homepage = "https://github.com/JackieZ123430/qemu-scanout-diff"
Repository = "https://github.com/JackieZ123430/qemu-scanout-diff"
Issues = "https://github.com/JackieZ123430/qemu-scanout-diff/issues"
